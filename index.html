<!DOCTYPE html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B0E2E" />
    <!-- Pre-paint backdrop matches the hero so the address bar + first frame
         don't flash white before the stylesheet arrives. -->
    <style>
      html, body { background: #1B0E2E; color-scheme: dark; margin: 0; }
    </style>

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are
         NOT set here. They are per-route and come from <Seo> in src/seo.tsx,
         which vite-react-ssg writes into each pre-rendered HTML file at build
         time. Duplicating them in this template would emit two of every tag
         and put the homepage's values on every page — which is exactly the
         duplicate-metadata problem pre-rendering was added to fix. Only
         genuinely site-wide tags belong below. -->

    <!-- SVG favicon ships in ~6 KB instead of the 252 KB raster. Modern
         browsers prefer SVG; older ones fall back to the .png. -->
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mono-negative.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/motif-positive.png" />
    <link rel="apple-touch-icon" href="/brand/motif-positive.png" />
    <meta name="apple-mobile-web-app-title" content="Digital Movement" />
    <meta name="application-name" content="Digital Movement" />

    <!-- Image dimensions are the same asset on every route, so they stay
         here rather than being repeated per page. -->
    <meta property="og:image:secure_url" content="https://www.digitalmovement.co.nz/brand/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2460" />
    <meta property="og:image:height" content="1383" />

    <!-- No hero preloads here. They previously applied to the homepage only
         but shipped on every page: an unused 27KB high-priority poster fetch,
         and two as="video" hints Chrome never honoured. Route-specific hints
         belong on the element, not in this shared file. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load. The print → all swap delivers the CSS but
         doesn't gate first paint on it. SF Pro Display is the primary face
         on Apple devices so Kiwi mobile traffic mostly never waits for this
         at all. Trimmed to four weights we actually use. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
